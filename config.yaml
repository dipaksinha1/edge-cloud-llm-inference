seed: 42
data_dir: data
results_dir: results
models_dir: models
figures_dir: figures
dataset:
  gsm8k_test: 100
  mmlu_test: 100
  gsm8k_calibration: 150
  mmlu_calibration: 150
edge:
  host: http://localhost:11434
  models: [qwen2.5:3b, qwen2.5:0.5b, llama3.2:1b]
  hybrid_model: qwen2.5:3b
  timeout_s: 300
  memory_sample_hz: 10
  warmup_max_tokens: 1  # one unrecorded edge call before a run's first question; <= 0 = off
cloud:
  base_url: https://openrouter.ai/api/v1
  model: meta-llama/llama-3.3-70b-instruct
  providers: [coreweave/fp16]  # OpenRouter only: every call goes to these upstream providers, in order; [] = any
  api_key_env: OPENROUTER_API_KEY
  timeout_s: 120
  max_retries: 5
  max_calls_per_run: 1500
generation:
  max_tokens: 512
  temperature: 0.0
router:
  threshold: 0.6
  samples: 3
  sample_temperature: 0.7
  min_agree: 2
